<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Formulário</title>

    <link rel="icon" href="./form.png" type="image/png">

</head>
<body>
    <form id="meuFomulario" action="https://webhook.site/c495e78c-3bd1-4395-aeb3-9d451509f181" method="post">
    <label for="nome">Nome</label>
    <input 
        type="text" 
        id="nome"
        name="nome"
        placeholder="Digite seu nome"
        required
    >

    <label for="email" >E-mail</label>
    <input 
        type="email" 
        id="email"
        name="email"
        placeholder="e-mail@exemplo.com"
        required
    >
    <label for="senha">Senha:</label>
    <input 
        type="password"
        id="senha"
        name="senha"
        placeholder="Digite sua senha"
        minlength="8"
        pattern="(?.*[a-z])(?.*[A-Z])(?.*\d)(?.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}"
        
        required
    >
    <lebel for="idade">Idade</lebel>
    <input 
        type="number" 
        id="idade" 
        name="idade" 
        min="0" 
        max="120" 
        step="1"
        placeholder="Idade"
        required
    >

        <button type="submit">ENVIAR</button>
    </form>
</body>
</html>
